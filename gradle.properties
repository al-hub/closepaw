# Project-wide Gradle settings.
# 4g heap is the AGP-recommended floor when minifyEnabled=true — R8 shaking on
# the release variant OOMs at the 2g default once the dep graph (Compose +
# OpenAI SDK + BouncyCastle + Conscrypt + Leap) lands in memory.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Enable Gradle Build Cache (shared across worktrees)
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache (faster subsequent builds)
org.gradle.configuration-cache=true

# App version (consumed by app/build.gradle.kts)
VERSION_NAME=0.1.37
VERSION_CODE=38

# Release candidate: v0.1.37 simplifies P1 Samsung Internet READ to a single
# settled screenshot shared by the on-device OCR fallback and MCP image response.
# P1 remains ACTIVE until a source-grounded Galaxy Voice summary is verified.
# App/network/reboot recovery is deferred to P7. Do not mark P1 DONE on release.
# Signed Release runs only after current main Security CI passes.
