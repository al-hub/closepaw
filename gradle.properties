# Project-wide Gradle settings.
# 4g heap is the AGP-recommended floor when minifyEnabled=true — R8 shaking on
# the release variant OOMs at the 2g default once the dep graph (Compose +
# OpenAI SDK + BouncyCastle + Conscrypt + Leap) lands in memory.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Enable Gradle Build Cache (shared across worktrees)
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache (faster subsequent builds)
org.gradle.configuration-cache=true

# App version (consumed by app/build.gradle.kts)
VERSION_NAME=0.1.38
VERSION_CODE=39

# P2 release candidate: generalize P1 visible-screen READ across Samsung Internet,
# Chrome, and Google Gemini with one settled screenshot and local Korean OCR fallback.
# P1 remains DONE on v0.1.37; P2 remains ACTIVE until real Galaxy Voice E2E for
# Chrome and Gemini plus Samsung Internet regression checks are verified.
# P7 separately owns app/network/reboot recovery and long-term reliability.
# Signed Release runs only after current main Security CI passes.
