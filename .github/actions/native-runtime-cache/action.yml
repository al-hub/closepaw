name: Verified Android native runtime cache
description: Reuse exact-input unsigned native runtimes; build on miss without signing material.
inputs:
  runtime:
    description: cloudflared or all
    required: true
    default: all
  save-cache:
    description: Allow this caller to publish new main cache entries; use a single publisher job
    required: false
    default: 'true'
  require-cache-hit:
    description: Fail on a missing/invalid exact cache instead of rebuilding (cold-restore verification)
    required: false
    default: 'false'
outputs:
  cache-directory:
    description: Dedicated cache directory under runner.temp; caller may remove it before a restore probe
    value: ${{ steps.plan.outputs.cache-directory }}
  cloudflared-cache-key:
    value: ${{ steps.plan.outputs.cloudflared-key }}
    description: Exact cloudflared cache key
  tunnel-cache-key:
    value: ${{ steps.plan.outputs.tunnel-key }}
    description: Exact OpenAI tunnel cache key
  invalid-exact-cache:
    description: Exact remote entry existed but failed local validation; diagnostic only
    value: ${{ (steps.restore-cloud.outputs.cache-hit == 'true' && steps.verify-cloud.outputs.cloudflared-valid != 'true') || (inputs.runtime == 'all' && steps.restore-tunnel.outputs.cache-hit == 'true' && steps.verify-tunnel.outputs.tunnel-valid != 'true') }}
  cache-hit:
    description: All requested runtime entries restored and validated
    value: ${{ steps.verify-cloud.outputs.cloudflared-valid == 'true' && (inputs.runtime != 'all' || steps.verify-tunnel.outputs.tunnel-valid == 'true') }}
  cloudflared-cache-hit:
    description: Restored cloudflared passed input, checksum and ELF validation
    value: ${{ steps.verify-cloud.outputs.cloudflared-valid }}
  tunnel-cache-hit:
    description: Restored OpenAI tunnel passed validation (empty for cloudflared-only)
    value: ${{ steps.verify-tunnel.outputs.tunnel-valid }}
runs:
  using: composite
  steps:
    - name: Compute exact native input keys
      id: plan
      shell: bash
      env:
        NATIVE_RUNTIME: ${{ inputs.runtime }}
      run: |
        set -euo pipefail
        [[ "$NATIVE_RUNTIME" == cloudflared || "$NATIVE_RUNTIME" == all ]]
        python3 scripts/native-runtime-cache.py plan --runtime "$NATIVE_RUNTIME" --cache-root "$RUNNER_TEMP/closepaw-native-cache"
    - name: Restore exact cloudflared cache
      id: restore-cloud
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.plan.outputs.cloudflared-path }}
        key: ${{ steps.plan.outputs.cloudflared-key }}
    - name: Validate and stage cached cloudflared
      id: verify-cloud
      shell: bash
      run: python3 scripts/native-runtime-cache.py restore --runtime cloudflared --cache-root "$RUNNER_TEMP/closepaw-native-cache"
    - name: Restore exact OpenAI tunnel cache
      if: inputs.runtime == 'all'
      id: restore-tunnel
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.plan.outputs.tunnel-path }}
        key: ${{ steps.plan.outputs.tunnel-key }}
    - name: Validate and stage cached OpenAI tunnel
      if: inputs.runtime == 'all'
      id: verify-tunnel
      shell: bash
      run: python3 scripts/native-runtime-cache.py restore --runtime tunnel --cache-root "$RUNNER_TEMP/closepaw-native-cache"
    - name: Report invalid immutable exact entry
      if: (steps.restore-cloud.outputs.cache-hit == 'true' && steps.verify-cloud.outputs.cloudflared-valid != 'true') || (inputs.runtime == 'all' && steps.restore-tunnel.outputs.cache-hit == 'true' && steps.verify-tunnel.outputs.tunnel-valid != 'true')
      shell: bash
      run: |
        echo '::warning::Exact native cache entry failed validation; rebuild from pinned source. Evict the invalid immutable entry or bump cache schema after investigation. Do not use a cold-cache roundtrip probe for this entry.'
    - name: Require a real remote cache restore when requested
      if: inputs.require-cache-hit == 'true'
      shell: bash
      env:
        CLOUD_HIT: ${{ steps.verify-cloud.outputs.cloudflared-valid }}
        TUNNEL_HIT: ${{ steps.verify-tunnel.outputs.tunnel-valid }}
        NATIVE_RUNTIME: ${{ inputs.runtime }}
      run: |
        set -euo pipefail
        [[ "$CLOUD_HIT" == true ]]
        if [[ "$NATIVE_RUNTIME" == all ]]; then [[ "$TUNNEL_HIT" == true ]]; fi
    - name: Set up exact Go toolchain on native cache miss
      if: steps.verify-cloud.outputs.cloudflared-valid != 'true' || (inputs.runtime == 'all' && steps.verify-tunnel.outputs.tunnel-valid != 'true')
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.0'
        cache: false
    - name: Install pinned NDK and rebuild cloudflared on miss
      if: steps.verify-cloud.outputs.cloudflared-valid != 'true'
      shell: bash
      env:
        GOTOOLCHAIN: local
        GOFLAGS: ''
        GOEXPERIMENT: ''
        GOARM64: v8.0
        GOENV: 'off'
        GOWORK: 'off'
        CGO_CFLAGS: '-O2 -g'
        CGO_CXXFLAGS: '-O2 -g'
        CGO_CPPFLAGS: ''
        CGO_LDFLAGS: '-O2 -g'
      run: |
        set -euo pipefail
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
        ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash scripts/build-cloudflared-android.sh
        python3 scripts/native-runtime-cache.py pack --runtime cloudflared --cache-root "$RUNNER_TEMP/closepaw-native-cache"
    - name: Checkout pinned tunnel source on miss
      if: inputs.runtime == 'all' && steps.verify-tunnel.outputs.tunnel-valid != 'true'
      uses: actions/checkout@v4
      with:
        repository: openai/tunnel-client
        ref: a390c168ff1b2d14e73a95991c186c6aba3ff5a0
        path: .native-src/tunnel-client
        persist-credentials: false
    - name: Rebuild OpenAI tunnel on miss
      if: inputs.runtime == 'all' && steps.verify-tunnel.outputs.tunnel-valid != 'true'
      shell: bash
      env:
        GOTOOLCHAIN: local
        GOFLAGS: ''
        GOEXPERIMENT: ''
        GOARM64: v8.0
        GOENV: 'off'
        GOWORK: 'off'
        CGO_CFLAGS: '-O2 -g'
        CGO_CXXFLAGS: '-O2 -g'
        CGO_CPPFLAGS: ''
        CGO_LDFLAGS: '-O2 -g'
      run: |
        set -euo pipefail
        bash scripts/spike-build-openai-tunnel-android.sh "$GITHUB_WORKSPACE/.native-src/tunnel-client" "$RUNNER_TEMP/openai-tunnel"
        mkdir -p app/src/main/jniLibs/arm64-v8a
        cp "$RUNNER_TEMP/openai-tunnel/tunnel-client-runtime" app/src/main/jniLibs/arm64-v8a/libopenaitunnel.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libopenaitunnel.so
        python3 scripts/native-runtime-cache.py pack --runtime tunnel --cache-root "$RUNNER_TEMP/closepaw-native-cache"
    # Select one publisher caller per workflow (other callers use save-cache:false).
    # GitHub branch-scoped cache plus this guard forbids PR writes to main cache.
    # No restore-keys/prefix fallback. Invalid existing exact entries rebuild but
    # cannot be overwritten: evict them or bump schema after investigation.
    - name: Save newly built cloudflared only from main
      if: inputs.save-cache == 'true' && steps.plan.outputs.allow-write == 'true' && github.ref == 'refs/heads/main' && steps.restore-cloud.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.plan.outputs.cloudflared-path }}
        key: ${{ steps.plan.outputs.cloudflared-key }}
    - name: Save newly built OpenAI tunnel only from main
      if: inputs.runtime == 'all' && inputs.save-cache == 'true' && steps.plan.outputs.allow-write == 'true' && github.ref == 'refs/heads/main' && steps.restore-tunnel.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.plan.outputs.tunnel-path }}
        key: ${{ steps.plan.outputs.tunnel-key }}
