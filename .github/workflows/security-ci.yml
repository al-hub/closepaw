name: Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      clean_gradle_cache:
        description: 'New unpublished version only: clean unused Gradle entries'
        type: boolean
        default: false

permissions:
  contents: read

# Only obsolete PR runs are cancelled. Main/release production is never cancelled.
concurrency:
  group: security-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: ${{ inputs.clean_gradle_cache && 'on-success' || 'never' }}

      - name: Verify bridge is loopback-only by default
        run: |
          python3 tools/termux-bridge/closepaw_bridge.py --host 0.0.0.0 --port 18423 >/tmp/bridge.out 2>/tmp/bridge.err && exit 1 || true
          grep -q "refusing_non_loopback_host" /tmp/bridge.err

      - name: Termux bridge tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q tools/termux-bridge/tests

      - name: ChatGPT bridge core tests
        run: python3 -m pytest -q tools/chatgpt-bridge/tests

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,})' -- ':!*.md' ':!*.json' ':!.env.example' ':!**/src/test/**' ':!**/src/androidTest/**'; then
            echo "Potential committed secret detected"
            exit 1
          fi

      - name: Verify release input trust boundary
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify signed APK release gate
        shell: bash
        run: |
          bash -n scripts/release-apk.sh
          if env -u KEYSTORE_PATH -u KEYSTORE_PASSWORD -u KEY_ALIAS -u KEY_PASSWORD bash scripts/release-apk.sh > /tmp/release-gate.out 2>&1; then
            echo "Unsigned release incorrectly accepted" >&2
            exit 1
          fi
          grep -q 'KEYSTORE_PATH is required' /tmp/release-gate.out

      - name: Verify vendored icon provenance
        run: python3 scripts/verify-vendored-material-icons.py

      - name: Prepare verified cloudflared runtime
        id: native
        uses: ./.github/actions/native-runtime-cache
        with:
          runtime: cloudflared
          save-cache: 'false'

      - name: Plan impact-based acceptance (full release gates retained)
        env:
          ACCEPTANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          base="$ACCEPTANCE_BASE"
          if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          python3 scripts/acceptance.py plan --base "$base" --head HEAD --output build/acceptance/plan.json

      - name: Android unit tests, lint and debug APK
        run: bash scripts/ci-gradle.sh security :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Build acceptance evidence report
        if: always()
        env:
          ACCEPTANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          base="$ACCEPTANCE_BASE"
          if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          python3 scripts/acceptance.py report --base "$base" --head HEAD --output build/acceptance/report.json
          python3 scripts/acceptance.py performance app/build/reports/benchmarks/operation-hash.json --output build/acceptance/hash-performance.json

      - name: Upload acceptance evidence and raw host benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ github.run_id }}
          path: |
            build/acceptance
            app/build/reports/benchmarks
          if-no-files-found: error
          retention-days: 90

      - name: Reject extended icons in resolved production dependencies
        run: python3 scripts/verify-vendored-material-icons.py --resolved-license-report app/src/main/assets/open_source_licenses.json

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: closepaw-security-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gradle-timing-${{ github.run_id }}
          path: |
            build/ci-metrics
            build/reports/profile
          retention-days: 14

  # R8/release compilation overlaps unit tests/lint on an independent runner.
  # No signing credentials. Only this exact successful main run can be signed.
  unsigned-release:
    # Optimized APK is a main gate; PRs retain tests/lint/debug/UI.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: ${{ inputs.clean_gradle_cache && 'on-success' || 'never' }}
      - name: Verify vendored icon provenance
        run: python3 scripts/verify-vendored-material-icons.py
      - name: Prepare verified native runtimes
        id: native
        uses: ./.github/actions/native-runtime-cache
        with:
          runtime: all
      - name: Clear local native cache for first-main restore proof
        if: steps.native.outputs.cache-hit != 'true' && steps.native.outputs.invalid-exact-cache != 'true'
        env:
          NATIVE_CACHE_DIRECTORY: ${{ steps.native.outputs.cache-directory }}
        run: |
          set -euo pipefail
          test "$NATIVE_CACHE_DIRECTORY" = "$RUNNER_TEMP/closepaw-native-cache"
          rm -rf -- "$NATIVE_CACHE_DIRECTORY"
      - name: Prove exact remote native cache restore after cold build
        if: steps.native.outputs.cache-hit != 'true' && steps.native.outputs.invalid-exact-cache != 'true'
        uses: ./.github/actions/native-runtime-cache
        with:
          runtime: all
          require-cache-hit: 'true'
      - name: Build optimized unsigned release
        run: |
          set -euo pipefail
          bash scripts/ci-gradle.sh release :app:assembleRelease
          python3 scripts/verify-vendored-material-icons.py --resolved-license-report app/src/main/assets/open_source_licenses.json
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenaitunnel.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libcloudflared.so'
          mkdir -p unsigned-release
          cp "$apk" unsigned-release/
          python3 - <<'METADATA'
          import hashlib, json, os, pathlib
          props = dict(line.split('=', 1) for line in pathlib.Path('gradle.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          apk = pathlib.Path('unsigned-release/app-release-unsigned.apk')
          pathlib.Path('unsigned-release/metadata.json').write_text(json.dumps(dict(
              source_commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
              version=props['VERSION_NAME'], version_code=props['VERSION_CODE'],
              sha256=hashlib.sha256(apk.read_bytes()).hexdigest()), indent=2))
          METADATA
      - name: Upload unsigned release for exact main CI run
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-${{ github.sha }}
          path: unsigned-release
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload release task timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gradle-timing-${{ github.run_id }}
          path: |
            build/ci-metrics
            build/reports/profile
          retention-days: 14
