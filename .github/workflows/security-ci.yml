name: Security CI

on:
  push:
    branches: [ main, 'security/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify bridge is loopback-only by default
        run: |
          python3 tools/termux-bridge/closepaw_bridge.py --host 0.0.0.0 --port 18423 >/tmp/bridge.out 2>/tmp/bridge.err && exit 1 || true
          grep -q "refusing_non_loopback_host" /tmp/bridge.err

      - name: Termux bridge tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q tools/termux-bridge/tests

      - name: ChatGPT bridge core tests
        run: python3 -m pytest -q tools/chatgpt-bridge/tests

      - name: ChatGPT plugin MCP tests
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/chatgpt-plugin-mcp/requirements.txt
          python3 -m pytest -q tools/chatgpt-plugin-mcp/tests

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,})' -- ':!*.md' ':!*.json' ':!.env.example' ':!**/src/test/**' ':!**/src/androidTest/**'; then
            echo "Potential committed secret detected"
            exit 1
          fi

      - name: Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: closepaw-security-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
