name: Premium UX UI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-ui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  panel-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Verify vendored icon provenance
        run: python3 scripts/verify-vendored-material-icons.py
      - name: Compile app and instrumented UI tests
        # View-only QA: arm64 tunnel/cloudflared production binaries are not needed or exercised.
        run: bash scripts/ci-gradle.sh ui-compile :app:assembleDebug :app:assembleDebugAndroidTest :terminal-fixture:assembleDebug -PclosepawInputFixtures=true -Pandroid.injected.build.abi=x86_64
      - name: Enable hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run native panel behavior and rendered-layout checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/ci-gradle.sh terminal-fixture-install :terminal-fixture:installDebug -PclosepawInputFixtures=true -Pandroid.injected.build.abi=x86_64
            bash scripts/ci-gradle.sh ui-test :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=ai.closepaw.qa.RemoteControlPanelTest,ai.closepaw.qa.RemoteControlPanelRenderingTest,ai.closepaw.qa.ControlOverlayWindowTest,ai.closepaw.qa.IslandOperationTest,ai.closepaw.qa.IslandScreenCoordinatesTest,ai.closepaw.qa.ClipboardProvenanceTest,ai.closepaw.qa.TerminalInputConnectionTest -PclosepawInputFixtures=true --stacktrace
            mkdir -p ui-render-evidence
            adb pull /sdcard/Download/closepaw-premium-ux-qa ui-render-evidence
            test "$(find ui-render-evidence -name '*.png' | wc -l)" -eq 8
      - name: Report exact instrumentation failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      print(case.attrib.get('classname'), case.attrib.get('name'))
                      print(failure.text or failure.attrib)
          PY
      - name: Upload UI test and rendered-layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-ux-ui-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            ui-render-evidence
            build/ci-metrics
            build/reports/profile
          if-no-files-found: warn
          retention-days: 14
