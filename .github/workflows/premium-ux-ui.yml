name: Premium UX UI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_capture_candidate:
        description: 'Build a separate debug package for physical capture acceptance'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: premium-ui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  panel-instrumentation:
    # A candidate dispatch must never replace the real main UI signing gate.
    if: github.ref == 'refs/heads/main' || github.event_name != 'workflow_dispatch' || !inputs.build_capture_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Verify vendored icon provenance
        run: python3 scripts/verify-vendored-material-icons.py
      - name: Compile app and instrumented UI tests
        # View-only QA: arm64 tunnel/cloudflared production binaries are not needed or exercised.
        run: bash scripts/ci-gradle.sh ui-compile :app:assembleDebug :app:assembleDebugAndroidTest :terminal-fixture:assembleDebug -PclosepawInputFixtures=true -Pandroid.injected.build.abi=x86_64
      - name: Enable hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run native panel behavior and rendered-layout checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Hosted runner disk can be <6 GiB after Gradle/SDK setup. The
          # default userdata image needs ~7.3 GiB; 3 GiB is sufficient for
          # the isolated UI fixtures without skipping instrumentation.
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/ci-gradle.sh replacement-install :app:installDebug :app:installDebugAndroidTest :app:stagePackageReplacementFixture -PclosepawInputFixtures=true -Pandroid.injected.build.abi=x86_64
            python3 scripts/qa-package-replacement.py
            bash scripts/ci-gradle.sh terminal-fixture-install :terminal-fixture:installDebug -PclosepawInputFixtures=true -Pandroid.injected.build.abi=x86_64
            bash scripts/ci-gradle.sh ui-test :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=ai.closepaw.qa.BrowserReadResolverTest,ai.closepaw.qa.RemoteControlPanelTest,ai.closepaw.qa.RemoteControlPanelRenderingTest,ai.closepaw.qa.ControlOverlayWindowTest,ai.closepaw.qa.IslandOperationTest,ai.closepaw.qa.IslandUserActionRenderingTest,ai.closepaw.qa.IslandScreenCoordinatesTest,ai.closepaw.qa.ClipboardProvenanceTest,ai.closepaw.qa.TerminalInputConnectionTest,ai.closepaw.qa.ProjectionTuningPersistenceTest,ai.closepaw.qa.WindowVisualCaptureGeometryTest,ai.closepaw.chatgpt.operations.OperationTaskSqliteCandidateAndroidTest -PclosepawInputFixtures=true --stacktrace
            mkdir -p ui-render-evidence
            adb pull /sdcard/Download/closepaw-premium-ux-qa ui-render-evidence
            test "$(find ui-render-evidence -name '*.png' | wc -l)" -eq 8
      - name: Report exact instrumentation failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      print(case.attrib.get('classname'), case.attrib.get('name'))
                      print(failure.text or failure.attrib)
          PY
      - name: Upload UI test and rendered-layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-ux-ui-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            ui-render-evidence
            build/package-replacement
            build/ci-metrics
            build/reports/profile
          if-no-files-found: warn
          retention-days: 14

  capture-candidate:
    # Build the separately-installable APK automatically for the dedicated #147
    # physical debug branch; ordinary PRs retain their prior workload.
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/147-orange-debug-candidate-')) || (github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.build_capture_candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Restore protected persistent candidate signing identity
        env:
          QA_DEBUG_KEYSTORE_BASE64: ${{ secrets.CLOSEPAW_QA_DEBUG_KEYSTORE_BASE64 }}
          QA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_QA_DEBUG_KEYSTORE_PASSWORD }}
          QA_DEBUG_KEY_ALIAS: ${{ secrets.CLOSEPAW_QA_DEBUG_KEY_ALIAS }}
          QA_DEBUG_KEY_PASSWORD: ${{ secrets.CLOSEPAW_QA_DEBUG_KEY_PASSWORD }}
          QA_DEBUG_CERT_SHA256: ${{ vars.CLOSEPAW_QA_DEBUG_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$QA_DEBUG_KEYSTORE_BASE64" ] || [ -z "$QA_DEBUG_KEYSTORE_PASSWORD" ] ||
             [ -z "$QA_DEBUG_KEY_ALIAS" ] || [ -z "$QA_DEBUG_KEY_PASSWORD" ] ||
             [ -z "$QA_DEBUG_CERT_SHA256" ]; then
            echo 'Protected QA signing identity or pinned certificate is not configured; candidate publication blocked.' >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/closepaw-qa-debug.jks"
          umask 077
          printf '%s' "$QA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          chmod 600 "$keyfile"
          printf 'QA_DEBUG_KEYSTORE_PATH=%s\n' "$keyfile" >> "$GITHUB_ENV"
          printf 'QA_DEBUG_KEYSTORE_PASSWORD=%s\nQA_DEBUG_KEY_ALIAS=%s\nQA_DEBUG_KEY_PASSWORD=%s\nQA_DEBUG_CERT_SHA256=%s\n' \
            "$QA_DEBUG_KEYSTORE_PASSWORD" "$QA_DEBUG_KEY_ALIAS" "$QA_DEBUG_KEY_PASSWORD" "$QA_DEBUG_CERT_SHA256" >> "$GITHUB_ENV"
      - name: Build side-by-side debug capture candidate and its test APK
        # Public candidate ndk.abiFilters limits packaging. No IDE-injected ABI
        # build: the app APK must install with the ordinary Android installer.
        run: bash scripts/ci-gradle.sh capture-candidate :app:stageCaptureCandidate -PclosepawCaptureCandidate=true
      - name: Verify candidate identity and record exact-source integrity
        run: |
          set -euo pipefail
          echo "QA candidate artifact preflight (sizes only, no credentials)"
          find build/capture-candidate -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          for apk in candidate-app.apk candidate-tests.apk; do
            if [ ! -s "build/capture-candidate/$apk" ]; then
              echo "QA candidate staging missing/empty: $apk" >&2
              exit 1
            fi
          done
          echo "QA staged both APK files"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          if [ ! -x "$aapt" ]; then echo 'Android aapt executable missing' >&2; exit 1; fi
          if ! "$aapt" dump badging build/capture-candidate/candidate-app.apk > build/capture-candidate/manifest.txt; then
            echo 'Android aapt failed to decode candidate APK' >&2
            exit 1
          fi
          echo "QA APK badging decoded"
          if ! grep -q "^package: name='ai.closepaw.capturecandidate'" build/capture-candidate/manifest.txt; then
            grep '^package:' build/capture-candidate/manifest.txt >&2 || true
            echo 'Candidate package identity mismatch' >&2
            exit 1
          fi
          if ! grep -q '^application-debuggable' build/capture-candidate/manifest.txt; then
            echo 'Candidate is not debuggable' >&2
            exit 1
          fi
          if grep -q '^application-testOnly' build/capture-candidate/manifest.txt; then
            echo 'Candidate app is testOnly; ordinary installation would fail' >&2
            exit 1
          fi
          if ! grep -q "native-code: 'arm64-v8a'" build/capture-candidate/manifest.txt; then
            grep '^native-code:' build/capture-candidate/manifest.txt >&2 || true
            echo 'Candidate APK is missing arm64 native support' >&2
            exit 1
          fi
          echo "QA package, debuggability and arm64 gates passed"
          if ! "$aapt" dump xmltree build/capture-candidate/candidate-app.apk AndroidManifest.xml > build/capture-candidate/manifest-tree.txt; then
            echo 'Android aapt failed to decode candidate manifest' >&2
            exit 1
          fi
          if ! grep -q 'ai.closepaw.qa.LocalCaptureQaActivity' build/capture-candidate/manifest-tree.txt; then
            echo 'Candidate nonexported QA entry is missing from manifest' >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          if [ ! -x "$apksigner" ]; then echo 'Android apksigner executable missing' >&2; exit 1; fi
          if ! "$apksigner" verify --print-certs build/capture-candidate/candidate-app.apk > build/capture-candidate/public-signer-output.txt; then
            echo 'Candidate APK apksigner verification failed' >&2
            exit 1
          fi
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/capture-candidate/public-signer-output.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$QA_DEBUG_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]]; then echo 'Signer verification returned no valid certificate digest' >&2; exit 1; fi
          if [ "$actual" != "$expected" ]; then
            echo 'QA signer differs from pinned certificate; candidate artifact blocked.' >&2
            exit 1
          fi
          printf 'qa_debug_cert_sha256=%s\n' "$actual" > build/capture-candidate/signing-identity.txt
          printf '%s\n' "$GITHUB_SHA" > build/capture-candidate/source.txt
          sha256sum build/capture-candidate/candidate-app.apk build/capture-candidate/candidate-tests.apk > build/capture-candidate/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: capture-candidate-${{ github.sha }}
          path: build/capture-candidate
          if-no-files-found: error
          retention-days: 7

  package-replacement-api37:
    # BLOCKED: run42909197801 cannot find platforms;android-37. No unsupported retries.
    if: false
    # The physical handset now reports Android17/API37; keep the existing API35
    # UI gate and test the unchanged update-receiver boundary separately here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Compile isolated debug replacement fixture
        run: bash scripts/ci-gradle.sh replacement37-compile :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64
      - name: Enable hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Actual package replacement on API37
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/ci-gradle.sh replacement37-install :app:installDebug :app:installDebugAndroidTest -Pandroid.injected.build.abi=x86_64
            python3 scripts/qa-package-replacement.py
      - name: Upload API37 replacement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-replacement-api37-${{ github.run_id }}
          path: |
            build/package-replacement
            build/ci-metrics
          if-no-files-found: warn
          retention-days: 14
