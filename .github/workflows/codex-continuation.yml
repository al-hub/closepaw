name: Codex Development Continuation

# Runs only after the event gate has been reviewed and merged into main.
on:
  workflow_run:
    workflows: [Security CI, Premium UX UI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: codex-development-pr-143
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
      head: ${{ steps.guard.outputs.head }}
    steps:
      - name: Validate exact trusted PR and successful CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          pr="$(gh api "repos/$REPO/pulls/143")"
          [[ "$(jq -r '.state' <<< "$pr")" == open ]] || exit 0
          [[ "$(jq -r '.draft' <<< "$pr")" == true ]] || exit 0
          [[ "$(jq -r '.base.ref' <<< "$pr")" == main ]] || exit 0
          [[ "$(jq -r '.head.repo.full_name' <<< "$pr")" == "$REPO" ]] || exit 0
          head="$(jq -r '.head.sha' <<< "$pr")"
          if [[ "$EVENT_NAME" == workflow_run && "$EVENT_SHA" != "$head" ]]; then exit 0; fi
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$head&per_page=100")"
          for name in 'Security CI' 'Premium UX UI'; do
            jq -e --arg n "$name" --arg h "$head" '[.workflow_runs[] | select(.name == $n and .head_sha == $h and .event == "pull_request" and .status == "completed" and .conclusion == "success")] | length > 0' <<< "$runs" >/dev/null || exit 0
          done
          # Bound autonomous loops; never rely on a model to enforce the budget.
          commits="$(gh api --paginate "repos/$REPO/pulls/143/commits?per_page=100")"
          rounds="$(jq -s '[.[][] | select(.commit.message | startswith("agent-round:"))] | length' <<< "$commits")"
          if (( rounds >= 3 )); then echo "Three unattended iterations reached; review required."; exit 0; fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  propose:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head }}
          persist-credentials: false
          fetch-depth: 0
      - name: Produce one bounded TDD improvement
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt: |
            You are the authorized ClosePaw Android coding agent for PR #143.
            Read AI.md, AGENTS.md, doc/project/WORKS_HANDOFF.md, doc/dev/github-signed-release.md.
            Work on ONE safe, locally testable step in #126 then #140 then #142, following TDD and SRP.
            Do not access devices, run releases, use private screen data, modify workflow/security/secret files,
            auto-approve, merge PRs, or claim physical verification. Respect the user's stopped session.
            Only change app/src/main or app/src/test and relevant non-sensitive doc/dev/*.md files.
            Avoid new dependencies. Run appropriate bounded tests if possible.
            If no safe meaningful change is feasible, leave the tree clean and explain why.
      - name: Create untrusted patch artifact, never push here
        shell: bash
        run: |
          set -euo pipefail
          git add -N app/src/main app/src/test doc/dev || true
          git diff --binary HEAD -- app/src/main app/src/test doc/dev > "$RUNNER_TEMP/codex.patch"
          cp "$RUNNER_TEMP/codex.patch" "$GITHUB_WORKSPACE/codex.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-pr143-patch-${{ needs.authorize.outputs.head }}
          path: codex.patch
          retention-days: 2

  apply:
    needs: [authorize, propose]
    if: needs.propose.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issues-126-140-142-integrated
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: codex-pr143-patch-${{ needs.authorize.outputs.head }}
          path: "$RUNNER_TEMP/patch-in"
      - name: Revalidate SHA, patch scope and commit exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.head }}
          TOKEN: ${{ secrets.CLOSEPAW_AGENT_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          pr="$(gh api "repos/$REPO/pulls/143")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$EXPECTED_SHA" ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == open && "$(jq -r '.draft' <<< "$pr")" == true ]] || exit 1
          patch="$RUNNER_TEMP/patch-in/codex.patch"
          test -f "$patch"
          if [[ ! -s "$patch" ]]; then echo 'No patch; no push.'; exit 0; fi
          # Reject unexpected modifications (including workflow, build, secrets, symlinks).
          git apply --numstat "$patch" | while IFS=$'\t' read -r added deleted path; do
            case "$path" in
              app/src/main/*|app/src/test/*|doc/dev/*.md) ;;
              *) echo "Disallowed patch path: $path" >&2; exit 1;;
            esac
          done
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          git add -- app/src/main app/src/test doc/dev
          [[ -n "$(git diff --cached --name-only)" ]] || exit 0
          git config user.name 'closepaw-codex-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'agent-round: one bounded TDD follow-up (#143)'
          # Must push using an explicitly permitted token, not expose it to Codex job.
          if [[ -z "$TOKEN" ]]; then echo "CLOSEPAW_AGENT_PUSH_TOKEN not configured; cannot trigger follow-up CI. No push." >&2; exit 1; fi
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feat/issues-126-140-142-integrated
