name: Signed Release

on:
  # Fallback for main commits made by integrations that do not emit push workflows.
  # The scheduled job is lightweight and dispatches Security CI only while
  # the current version is unpublished. Security CI then triggers Signed Release.
  schedule:
    - cron: '11,41 * * * *'
  workflow_run:
    workflows: [ "Security CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create version tag and publish GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: signed-release-main
  cancel-in-progress: false

jobs:
  ensure-main-security-ci:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Dispatch Security CI for unpublished main version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if grep -Fxq closepaw-aa-bridge.apk <<< "$existing" &&
               grep -Fxq closepaw-aa-bridge.apk.sha256 <<< "$existing"; then
              echo "Release $tag already contains both assets; no dispatch needed."
              exit 0
            fi
          fi
          git fetch origin --tags --quiet
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            target="$(git rev-list -n 1 "$tag")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Existing immutable $tag points at $target, not main $GITHUB_SHA."
              echo "Manual assessment required; refusing to move an existing tag." >&2
              exit 1
            fi
          fi
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/security-ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100")"
          if jq -e '.workflow_runs | any(.status != "completed")' <<< "$ci" >/dev/null; then
            echo "Security CI is already running or queued for this main commit."
            exit 0
          fi
          release_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/signed-release.yml/runs?head_sha=$GITHUB_SHA&per_page=100")"
          if jq -e '.workflow_runs | any(.event == "workflow_run" and .status != "completed")' <<< "$release_runs" >/dev/null; then
            echo "Signed Release is already running or queued."
            exit 0
          fi
          attempts="$(jq '[.workflow_runs[] | select(.event == "workflow_dispatch")] | length' <<< "$ci")"
          if (( attempts >= 3 )); then
            echo "Security CI has already been dispatched $attempts times for this main commit."
            echo "Stopping automatic retries; investigate workflow failure." >&2
            exit 1
          fi
          echo "Unpublished $tag: dispatching Security CI for main $GITHUB_SHA."
          gh workflow run security-ci.yml --ref main

  signed-release:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          code="$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2)"
          test -n "$version" && test -n "$code"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Validate main and CI; classify release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "CI run is not for current main; refusing stale release" >&2; exit 1;
          }
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '.workflow_runs | any(.name == "Security CI" and .conclusion == "success" and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch" or .event == "schedule"))' | grep -qx true || {
              echo "Successful main Security CI is required before manual publishing" >&2; exit 1;
            }
          fi
          git fetch origin --tags --quiet
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            target="$(git rev-list -n 1 "$TAG")"
            test "$target" = "$(git rev-parse HEAD)" || {
              echo "Immutable tag exists at another commit; manual review required" >&2; exit 1;
            }
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: validating both published assets"
            mkdir -p "$RUNNER_TEMP/release-check"
            if gh release download "$TAG" -D "$RUNNER_TEMP/release-check" \
              -p 'closepaw-aa-bridge.apk' -p 'closepaw-aa-bridge.apk.sha256' 2>/dev/null &&
              test -s "$RUNNER_TEMP/release-check/closepaw-aa-bridge.apk" &&
              test -s "$RUNNER_TEMP/release-check/closepaw-aa-bridge.apk.sha256"; then
              ( cd "$RUNNER_TEMP/release-check" && sha256sum -c closepaw-aa-bridge.apk.sha256 )
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release assets incomplete; rebuild and upload only missing assets."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve exact trusted Security CI run
        if: steps.state.outputs.skip != 'true'
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            run_id="$TRIGGER_RUN_ID"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/security-ci.yml/runs?head_sha=$sha&branch=main&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch" or .event == "schedule")][0].id')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/security-ci-run.json"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download unsigned APK from exact CI run
        if: steps.state.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run_id }}
          name: unsigned-release-${{ steps.ci.outputs.source_sha }}
          path: unsigned-release

      - name: Verify trusted main provenance and unsigned APK
        if: steps.state.outputs.skip != 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release-input.py unsigned-release "$RUNNER_TEMP/security-ci-run.json" \
            "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$EXPECTED_VERSION" "$EXPECTED_CODE"
          apk=unsigned-release/app-release-unsigned.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/unsigned-manifest.txt"
          grep -F "package: name='ai.closepaw' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_VERSION'" "$RUNNER_TEMP/unsigned-manifest.txt"
          ! grep -q 'application-debuggable' "$RUNNER_TEMP/unsigned-manifest.txt"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenaitunnel.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libcloudflared.so'

      - name: Require signing secrets
        if: steps.state.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.CLOSEPAW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOSEPAW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOSEPAW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/closepaw-release.jks"

      - name: Preflight signing identity against v0.1.33
        if: steps.state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_ALIAS: ${{ secrets.CLOSEPAW_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Read the certificate from the existing public APK and the signing
          # keystore. Do not export private keys or weaken the update check.
          verifier="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$verifier"
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download v0.1.33 -D "$RUNNER_TEMP/previous-release" -p closepaw-aa-bridge.apk
          # Capture public signer metadata once so parsing errors can be diagnosed.
          signer_info="$("$verifier" verify --print-certs "$RUNNER_TEMP/previous-release/closepaw-aa-bridge.apk")"
          expected="$(printf '%s\n' "$signer_info" |
            sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*$/\1/p' |
            head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$(keytool -exportcert -rfc \
            -keystore "$RUNNER_TEMP/closepaw-release.jks" \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" |
            openssl x509 -noout -fingerprint -sha256 |
            sed -n 's/^[^=]*=//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$expected" ]]; then
            echo "::error::Unable to parse SHA-256 certificate fingerprint from v0.1.33 APK." >&2
            echo "apksigner public signer metadata:"
            printf '%s\n' "$signer_info" | grep -E 'Signer|SHA-256|SHA256' | head -20 || true
            "$verifier" version || true
            exit 1
          fi
          if [[ -z "$actual" ]]; then
            echo "::error::Unable to parse signing keystore certificate fingerprint." >&2
            echo "No private key or keystore contents were exposed."
            exit 1
          fi
          echo "v0.1.33 APK signer SHA-256: $expected"
          echo "Configured keystore signer SHA-256: $actual"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Signing keystore certificate differs from published v0.1.33; refusing incompatible update." >&2
            echo "v0.1.33 APK signing certificate SHA-256: $expected"
            echo "Configured keystore certificate SHA-256: $actual"
            echo "Restore the ORIGINAL signing keystore in GitHub Actions secrets; never regenerate or bypass this check."
            exit 1
          fi
          echo "Signing keystore matches the existing v0.1.33 app."

      - name: Align and sign verified release with original key
        if: steps.state.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOSEPAW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOSEPAW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          align="$(dirname "$signer")/zipalign"
          "$align" -f -P 16 4 unsigned-release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$align" -c -P 16 4 "$RUNNER_TEMP/aligned.apk"
          "$signer" sign --ks "$RUNNER_TEMP/closepaw-release.jks" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --out closepaw-aa-bridge.apk "$RUNNER_TEMP/aligned.apk"
          sha256sum closepaw-aa-bridge.apk > closepaw-aa-bridge.apk.sha256

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/closepaw-release.jks"

      - name: Validate signer against previous signed Release
        if: steps.state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$signer"
          test -s "$RUNNER_TEMP/previous-release/closepaw-aa-bridge.apk"
          current="$("$signer" verify --print-certs closepaw-aa-bridge.apk | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*$/\1/p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          previous="$("$signer" verify --print-certs "$RUNNER_TEMP/previous-release/closepaw-aa-bridge.apk" | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*$/\1/p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$current" || -z "$previous" ]]; then
            echo "::error::Unable to read built or previous APK signing certificate SHA-256." >&2
            exit 1
          fi
          if [[ "$current" != "$previous" ]]; then
            echo "::error::Built APK signer differs from v0.1.33; refusing incompatible update." >&2
            echo "v0.1.33 certificate SHA-256: $previous"
            echo "New APK certificate SHA-256: $current"
            exit 1
          fi

      - name: Create version tag only if absent
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ClosePaw AA-Bridge $TAG"
          git push origin "$TAG"

      - name: Publish missing Release
        if: steps.state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          (sha256sum -c closepaw-aa-bridge.apk.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing Release: restore only missing assets without overwriting"
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if ! grep -Fxq closepaw-aa-bridge.apk <<< "$existing"; then
              gh release upload "$TAG" closepaw-aa-bridge.apk
            fi
            if ! grep -Fxq closepaw-aa-bridge.apk.sha256 <<< "$existing"; then
              gh release upload "$TAG" closepaw-aa-bridge.apk.sha256
            fi
            mkdir -p "$RUNNER_TEMP/published-check"
            gh release download "$TAG" -D "$RUNNER_TEMP/published-check" \
              -p closepaw-aa-bridge.apk -p closepaw-aa-bridge.apk.sha256
            (cd "$RUNNER_TEMP/published-check" && sha256sum -c closepaw-aa-bridge.apk.sha256)
          else
            gh release create "$TAG" closepaw-aa-bridge.apk closepaw-aa-bridge.apk.sha256 \
              --title "ClosePaw AA-Bridge $TAG" --generate-notes
          fi

      - name: Independently verify public APK download
        if: steps.state.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/public-apk-verification"
          mkdir -p "$out"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          # Anonymous public downloads, separate from the signed build/upload copies.
          curl --fail --location --retry 2 "$base/closepaw-aa-bridge.apk" -o "$out/closepaw-aa-bridge.apk"
          curl --fail --location --retry 2 "$base/closepaw-aa-bridge.apk.sha256" -o "$out/closepaw-aa-bridge.apk.sha256"
          (cd "$out" && sha256sum -c closepaw-aa-bridge.apk.sha256)
          test "$(sha256sum closepaw-aa-bridge.apk | cut -d' ' -f1)" = "$(sha256sum "$out/closepaw-aa-bridge.apk" | cut -d' ' -f1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs "$out/closepaw-aa-bridge.apk" | tee "$out/signature.txt"
          grep -Fq 'certificate SHA-256 digest: d6be7285b96b9f67b50df6daaf55e5501aef35ab484c170e60dd993590695aba' "$out/signature.txt"
          "$aapt" dump badging "$out/closepaw-aa-bridge.apk" > "$out/manifest.txt"
          grep -F "package: name='ai.closepaw' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_VERSION'" "$out/manifest.txt"
          unzip -l "$out/closepaw-aa-bridge.apk" > "$out/entries.txt"
          grep -F 'lib/arm64-v8a/libopenaitunnel.so' "$out/entries.txt"
          grep -F 'lib/arm64-v8a/libcloudflared.so' "$out/entries.txt"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "release_tag=$RELEASE_TAG"
            echo "version=$EXPECTED_VERSION"
            echo "version_code=$EXPECTED_CODE"
            sha256sum "$out/closepaw-aa-bridge.apk"
            wc -c < "$out/closepaw-aa-bridge.apk"
          } | tee "$out/verification.txt"

      - name: Upload public APK verification evidence
        if: success() && steps.state.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-apk-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-apk-verification/verification.txt
            ${{ runner.temp }}/public-apk-verification/signature.txt
            ${{ runner.temp }}/public-apk-verification/manifest.txt
          if-no-files-found: error
          retention-days: 14
