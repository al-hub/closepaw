name: Signed Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.CLOSEPAW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOSEPAW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOSEPAW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/closepaw-release.jks"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag $GITHUB_REF_NAME must equal $expected"; exit 1; }

      - name: Test and build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/closepaw-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOSEPAW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOSEPAW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk closepaw-aa-bridge.apk
          sha256sum closepaw-aa-bridge.apk > closepaw-aa-bridge.apk.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            closepaw-aa-bridge.apk closepaw-aa-bridge.apk.sha256 \
            --title "ClosePaw AA-Bridge $GITHUB_REF_NAME" \
            --generate-notes
