name: Signed Release

on:
  push:
    branches: [ main ]
    paths:
      - gradle.properties
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create version tag and publish GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Checkout OpenAI tunnel-client v0.0.15 source
        uses: actions/checkout@v4
        with:
          repository: openai/tunnel-client
          ref: a390c168ff1b2d14e73a95991c186c6aba3ff5a0
          path: tunnel-client
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.CLOSEPAW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOSEPAW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOSEPAW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/closepaw-release.jks"

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify pushed tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "${{ steps.version.outputs.tag }}" || {
            echo "Tag $GITHUB_REF_NAME must equal ${{ steps.version.outputs.tag }}"
            exit 1
          }

      - name: Build bundled OpenAI Secure MCP tunnel runtime for Android
        run: |
          set -euo pipefail
          bash scripts/spike-build-openai-tunnel-android.sh             "$GITHUB_WORKSPACE/tunnel-client"             "$RUNNER_TEMP/openai-tunnel"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/openai-tunnel/tunnel-client-runtime"             app/src/main/jniLibs/arm64-v8a/libopenaitunnel.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libopenaitunnel.so
          test -s app/src/main/jniLibs/arm64-v8a/libopenaitunnel.so

      - name: Build bundled cloudflared for Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash scripts/build-cloudflared-android.sh

      - name: Test and build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/closepaw-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.CLOSEPAW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOSEPAW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOSEPAW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/libopenaitunnel.so'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/libcloudflared.so'
          cp app/build/outputs/apk/release/app-release.apk closepaw-aa-bridge.apk
          sha256sum closepaw-aa-bridge.apk > closepaw-aa-bridge.apk.sha256

      - name: Create and push version tag
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ClosePaw AA-Bridge $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            closepaw-aa-bridge.apk closepaw-aa-bridge.apk.sha256 \
            --title "ClosePaw AA-Bridge $TAG" \
            --generate-notes
